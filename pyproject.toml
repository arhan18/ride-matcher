[project]
name = "ride-matcher"
version = "0.1.0"
description = "LangGraph ride-matching project that assigns candidate drivers to Uber ride requests."
requires-python = ">=3.9"
dependencies = [
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
